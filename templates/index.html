<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Tasks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="shell">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo">UI</div>
    <nav class="side-nav">
      <button class="side-btn active" data-nav="all" title="All tasks" aria-label="All tasks">
        <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      </button>
      <button class="side-btn" data-nav="overdue" title="Overdue tasks" aria-label="Overdue tasks">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 16v-4M12 16V8M16 16v-6"/></svg>
      </button>
      <button class="side-btn" data-nav="Pending" title="Pending tasks" aria-label="Pending tasks">
        <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>
      </button>
      <button class="side-btn" data-nav="Completed" title="Completed tasks" aria-label="Completed tasks">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 13h4l1.5 2.5h5L16 13h4"/></svg>
      </button>
    </nav>
    <div class="side-foot">
      <button class="side-btn" id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">
        <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
      </button>
      <button class="side-btn" id="resetBtn" title="Reset filters" aria-label="Reset filters">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <header class="topbar">
      <div class="search-wrap" id="searchWrap">
        <input type="search" id="searchInput" placeholder="Search tasks…" aria-label="Search tasks">
      </div>
      <button class="icon-btn" id="searchBtn" aria-label="Search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
      <button class="icon-btn" id="bellBtn" aria-label="Overdue tasks">
        <svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 1 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
        <span class="badge" id="bellBadge" hidden>0</span>
      </button>
      <div class="avatar" aria-hidden="true">RK</div>
    </header>

    <h1>My Tasks</h1>

    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="all" role="tab">All Tasks</button>
      <button class="tab" data-tab="Pending" role="tab">Pending Tasks</button>
      <button class="tab" data-tab="Completed" role="tab">Completed Tasks</button>
      <button class="tab" data-tab="overdue" role="tab">Overdue Tasks</button>
    </div>

    <section class="toolbar">
      <div class="filters">
        <label class="field date-field">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
          <input type="date" id="dateFilter" aria-label="Filter by due date">
        </label>
        <label class="field select-field">
          <select id="priorityFilter" aria-label="Choose priority">
            <option value="">Choose Priority</option>
            <option>Low</option><option>Medium</option><option>High</option>
          </select>
          <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
        </label>
        <button class="btn-filter" id="filterBtn">Filter</button>
      </div>
      <button class="btn-primary" id="newBtn">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Create New Task
      </button>
    </section>

    <section class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Title</th><th>Priority</th><th>Status</th><th>Created by</th><th>Date Assigned</th><th>Due Date</th><th class="actions-h"></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" hidden>
        <strong>No tasks found</strong>
        <span>Create a new task or change your filters.</span>
      </div>
    </section>

    <footer class="pager">
      <span class="muted">Rows per page:</span>
      <label class="field select-field small">
        <select id="perPage" aria-label="Rows per page">
          <option>5</option><option selected>10</option><option>25</option><option>50</option>
        </select>
        <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
      </label>
      <span class="range" id="range">0 of 0</span>
      <button class="icon-btn flat" id="prevBtn" aria-label="Previous page"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
      <button class="icon-btn flat" id="nextBtn" aria-label="Next page"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
    </footer>
  </main>
</div>

<!-- Create / edit modal -->
<div class="overlay" id="taskModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle">Create New Task</h2>
    <form id="taskForm" novalidate>
      <label>Title
        <input type="text" id="fTitle" maxlength="120" placeholder="e.g. Finish project report">
        <small class="error" id="eTitle"></small>
      </label>
      <label>Description
        <textarea id="fDesc" rows="3" maxlength="1000" placeholder="Add a few details (optional)"></textarea>
        <small class="error" id="eDescription"></small>
      </label>
      <label>Created by
        <input type="text" id="fCreatedBy" maxlength="60" placeholder="Your name (optional)">
        <small class="error" id="eCreated_by"></small>
      </label>
      <div class="two">
        <label>Deadline
          <input type="date" id="fDeadline">
          <small class="error" id="eDeadline"></small>
        </label>
        <label>Priority
          <select id="fPriority"><option>Low</option><option selected>Medium</option><option>High</option></select>
        </label>
      </div>
      <label>Status
        <select id="fStatus"><option>Pending</option><option>Completed</option></select>
      </label>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" data-close>Cancel</button>
        <button type="submit" class="btn-primary" id="saveBtn">Save task</button>
      </div>
    </form>
  </div>
</div>

<!-- View modal -->
<div class="overlay" id="viewModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="viewTitle">
    <h2 id="viewTitle">Task details</h2>
    <dl class="details" id="viewBody"></dl>
    <div class="modal-actions">
      <button type="button" class="btn-ghost" data-close>Close</button>
    </div>
  </div>
</div>

<!-- Delete modal -->
<div class="overlay" id="deleteModal" hidden>
  <div class="modal small" role="dialog" aria-modal="true" aria-labelledby="delTitle">
    <h2 id="delTitle">Delete this task?</h2>
    <p class="muted" id="delText"></p>
    <div class="modal-actions">
      <button type="button" class="btn-ghost" data-close>Keep task</button>
      <button type="button" class="btn-danger" id="confirmDelete">Delete task</button>
    </div>
  </div>
</div>

<div class="row-menu" id="rowMenu" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
